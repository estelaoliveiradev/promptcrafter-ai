name: CI - Feature para Develop

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Testes Unitários (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Executar testes com Pytest
        run: |
          pytest -v

  build-check:
    name: Verificação de Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ferramentas de build e validação
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Gerar pacote de distribuição
        run: python -m build

      - name: Validar integridade dos metadados do pacote
        run: twine check dist/*
