[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcraft-ai"
version = "0.1.0"
description = "Prompts de IA tipados e prontos para casos de uso de negócio no Brasil."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Estela de Oliveira" }
]
dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/estelaoliveiradev/promptcrafter-ai"
Documentation = "https://github.com/estelaoliveiradev/promptcrafter-ai#readme"
Repository = "https://github.com/estelaoliveiradev/promptcrafter-ai.git"
"Issues" = "https://github.com/estelaoliveiradev/promptcrafter-ai/issues"
"Changelog" = "https://github.com/estelaoliveiradev/promptcrafter-ai/releases"